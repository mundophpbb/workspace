    path: /workspace/validation_fix
    defaults: { _controller: mundophpbb.workspace.controller.tool:apply_validation_fixes }
    methods: [POST]

# Official EPV setup assistant
mundophpbb_workspace_epv_status:
    path: /workspace/epv/status
    defaults: { _controller: mundophpbb.workspace.controller.tool:epv_status }
    methods: [POST]

mundophpbb_workspace_epv_install:
    path: /workspace/epv/install
    defaults: { _controller: mundophpbb.workspace.controller.tool:epv_install }
    methods: [POST]

# ----------------------------------------------------------
# LOCK DO PROJETO (trancar/destrancar)
# Ativado agora (requer métodos no Project Controller).
# ----------------------------------------------------------
mundophpbb_workspace_lock_project:
    path: /workspace/lock_project
    defaults: { _controller: mundophpbb.workspace.controller.project:lock_project }
    methods: [POST]

mundophpbb_workspace_unlock_project:
    path: /workspace/unlock_project
    defaults: { _controller: mundophpbb.workspace.controller.project:unlock_project }
    methods: [POST]
