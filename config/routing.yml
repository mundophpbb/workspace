mundophpbb_workspace_download:
    path: /workspace/download/{project_id}
    defaults: { _controller: mundophpbb.workspace.controller.project:download_project }
    requirements:
        project_id: '\d+'
    methods: [GET]

# Final package in the directory layout required by the phpBB Extension Database: vendor/extension/...
mundophpbb_workspace_download_submission:
    path: /workspace/submission/{project_id}
    defaults: { _controller: mundophpbb.workspace.controller.project:download_submission_package }
    requirements:
        project_id: '\d+'
